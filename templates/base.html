{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Insta Clone
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <nav class="navbar">

        <div class="nav-container">

            <a href="{% url 'home' %}" class="logo">
                📸 Insta Clone
            </a>

            {% if request.user.is_authenticated %}

                <div class="nav-links">

                    <a href="{% url 'home' %}">
                        Home
                    </a>

                    <a href="{% url 'profile' %}">
                        Profile
                    </a>

                    <a href="{% url 'notifications' %}">
                        🔔 Notifications
                    </a>

                    <a href="{% url 'create_post' %}">
                        ➕ Create Post
                    </a>

                    <a href="{% url 'logout' %}">
                        Logout
                    </a>

                </div>

            {% else %}

                <div class="nav-links">

                    <a href="{% url 'login' %}">
                        Login
                    </a>

                    <a href="{% url 'register' %}">
                        Register
                    </a>

                </div>

            {% endif %}

        </div>

    </nav>


    <main class="main-container">

        {% block content %}

        {% endblock %}

    </main>


    <footer class="footer">

        <p>
            © 2026 Insta Clone — Built with Django ❤️
        </p>

    </footer>

</body>
</html>
