{% extends 'base.html' %}

{% block title %}Register - Insta Clone{% endblock %}

{% block content %}

<div class="form-card" style="max-width: 500px; margin: 40px auto;">

    <div style="text-align: center; margin-bottom: 30px;">

        <div style="font-size: 45px; margin-bottom: 10px;">
            📸
        </div>

        <h1>
            Create Account
        </h1>

        <p style="color: #8e8e8e; margin-top: 8px;">
            Join Insta Clone
        </p>

    </div>


    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn btn-primary"
            style="width: 100%; margin-top: 10px;"
        >
            Create Account
        </button>

    </form>


    <div style="
        text-align: center;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #efefef;
    ">

        <p style="color: #8e8e8e;">
            Already have an account?
        </p>

        <a
            href="{% url 'login' %}"
            class="btn btn-secondary"
            style="
                display: inline-block;
                margin-top: 10px;
            "
        >
            Login
        </a>

    </div>

</div>

{% endblock %}
